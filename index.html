<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>VIBES - Archive</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <!-- Load Core DB JS -->
        <script src="./data/db.js"></script>
        <style>
            body,
            html {
                margin: 0;
                padding: 0;
                height: 100%;
                overflow: hidden;
                font-family: 'Helvetica Neue', Arial, sans-serif;
            }
            .frame-header {
                width: 100%;
                height: 80px;
                border: none;
                display: block;
            }
            .frame-content {
                width: 100%;
                height: calc(100vh - 80px);
                border: none;
                display: block;
            }
            .auth-overlay {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0, 0, 0, 0.85);
                backdrop-filter: blur(5px);
                z-index: 9999;
                display: none;
                justify-content: center;
                align-items: center;
            }
            .auth-wrapper {
                position: relative;
                display: flex;
                flex-direction: column;
                align-items: center;
                width: 100%;
                max-width: 450px;
                padding: 20px;
            }
            .close-btn {
                position: absolute;
                top: -30px;
                right: 20px;
                background: none;
                border: none;
                color: #fff;
                font-size: 2rem;
                cursor: pointer;
                transition: color 0.2s;
                z-index: 10;
            }
            .close-btn:hover {
                color: #cc0000;
            }
            .auth-card {
                background-color: #0a0000;
                border: 1px solid #2a0505;
                border-radius: 12px;
                padding: 40px;
                width: 100%;
                box-sizing: border-box;
                box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 25px rgba(150, 0, 0, 0.1);
            }
            .auth-header {
                text-align: center;
                margin-bottom: 30px;
            }
            .auth-header img {
                height: 45px;
                margin-bottom: 10px;
            }
            .auth-header p {
                color: #aaaaaa;
                font-size: 0.8rem;
                margin: 0;
            }
            .form-group-auth {
                display: flex;
                flex-direction: column;
                margin-bottom: 20px;
            }
            .form-group-auth label {
                color: #cc0000;
                font-size: 0.85rem;
                font-weight: 600;
                margin-bottom: 8px;
            }
            .form-group-auth input {
                padding: 12px 15px;
                border-radius: 6px;
                border: none;
                background-color: #f5f5f5;
                font-size: 0.95rem;
                color: #111;
                outline: none;
            }
            .password-wrapper {
                position: relative;
                display: flex;
                align-items: center;
            }
            .password-wrapper input {
                width: 100%;
                padding-right: 40px;
                box-sizing: border-box;
            }
            .toggle-pw {
                position: absolute;
                right: 15px;
                color: #cc0000;
                cursor: pointer;
            }
            .auth-links {
                text-align: right;
                margin-bottom: 30px;
                margin-top: -5px;
            }
            .auth-links a {
                color: #cc0000;
                font-size: 0.8rem;
                text-decoration: none;
                transition: opacity 0.2s;
            }
            .auth-links a:hover {
                opacity: 0.8;
                text-decoration: underline;
            }
            .btn-wrapper {
                text-align: center;
            }
            .btn-auth {
                background-color: #cc0000;
                color: #ffffff;
                border: none;
                padding: 12px 40px;
                font-size: 1rem;
                font-weight: 700;
                border-radius: 6px;
                cursor: pointer;
                transition: background 0.2s;
                width: 160px;
            }
            .btn-auth:hover {
                background-color: #a30000;
            }
        </style>
    </head>
    <body>
        <iframe
            src="./src/component/header.html"
            name="header"
            class="frame-header"
            scrolling="no"></iframe>
        <iframe
            src="./src/page/dashboard.html"
            name="content"
            class="frame-content"
            scrolling="auto"></iframe>

        <!-- LOGIN MODAL -->
        <div id="loginModal" class="auth-overlay">
            <div class="auth-wrapper">
                <button class="close-btn" onclick="closeAllModals()">&times;</button>
                <div class="auth-card">
                    <div class="auth-header">
                        <img src="./public/img/logo-putih.png" alt="VIBES Logo">
                    </div>
                    <form id="loginForm">
                        <div class="form-group-auth">
                            <label>Username/Email</label>
                            <input type="text" id="loginEmail" required="required">
                        </div>
                        <div class="form-group-auth">
                            <label>Password</label>
                            <div class="password-wrapper">
                                <input type="password" id="loginPwd" required="required">
                                <i
                                    class="fa-solid fa-eye-slash toggle-pw"
                                    id="eyeIconLogin"
                                    onclick="togglePasswordVisibility('loginPwd', 'eyeIconLogin')"></i>
                            </div>
                        </div>
                        <div class="auth-links">
                            <a href="#" onclick="switchToRegister()">Belum Punya Akun?</a>
                        </div>
                        <div class="btn-wrapper">
                            <button type="submit" class="btn-auth">Login</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- REGISTER MODAL -->
        <div id="registerModal" class="auth-overlay">
            <div class="auth-wrapper">
                <button class="close-btn" onclick="closeAllModals()">&times;</button>
                <div class="auth-card">
                    <div class="auth-header">
                        <img src="./public/img/logo-putih.png" alt="VIBES Logo">
                        <p>Silahkan masukan data anda untuk membuat akun</p>
                    </div>
                    <form id="registerForm">
                        <div class="form-group-auth">
                            <label>Username/Email</label>
                            <input type="text" id="regEmail" required="required">
                        </div>
                        <div class="form-group-auth">
                            <label>Password</label>
                            <div class="password-wrapper">
                                <input type="password" id="regPwd" required="required">
                                <i
                                    class="fa-solid fa-eye-slash toggle-pw"
                                    id="eyeIconReg1"
                                    onclick="togglePasswordVisibility('regPwd', 'eyeIconReg1')"></i>
                            </div>
                        </div>
                        <div class="form-group-auth">
                            <label>Confirm password</label>
                            <div class="password-wrapper">
                                <input type="password" id="regConfirmPwd" required="required">
                                <i
                                    class="fa-solid fa-eye-slash toggle-pw"
                                    id="eyeIconReg2"
                                    onclick="togglePasswordVisibility('regConfirmPwd', 'eyeIconReg2')"></i>
                            </div>
                        </div>
                        <div class="auth-links">
                            <a href="#" onclick="switchToLogin()">Sudah Punya Akun?</a>
                        </div>
                        <div class="btn-wrapper">
                            <button type="submit" class="btn-auth">Register</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <script>
            const loginModal = document.getElementById('loginModal');
            const registerModal = document.getElementById('registerModal');

            function toggleLoginModal() {
                closeAllModals();
                loginModal.style.display = 'flex';
            }
            function closeAllModals() {
                loginModal.style.display = 'none';
                registerModal.style.display = 'none';
            }
            function switchToRegister() {
                loginModal.style.display = 'none';
                registerModal.style.display = 'flex';
            }
            function switchToLogin() {
                registerModal.style.display = 'none';
                loginModal.style.display = 'flex';
            }

            function togglePasswordVisibility(inputId, iconId) {
                const pwdInput = document.getElementById(inputId);
                const eyeIcon = document.getElementById(iconId);
                if (pwdInput.type === 'password') {
                    pwdInput.type = 'text';
                    eyeIcon
                        .classList
                        .remove('fa-eye-slash');
                    eyeIcon
                        .classList
                        .add('fa-eye');
                } else {
                    pwdInput.type = 'password';
                    eyeIcon
                        .classList
                        .remove('fa-eye');
                    eyeIcon
                        .classList
                        .add('fa-eye-slash');
                }
            }

            // AUTH LOGIC INTEGRATION
            document
                .getElementById('loginForm')
                .addEventListener('submit', (e) => {
                    e.preventDefault();
                    const email = document
                        .getElementById('loginEmail')
                        .value;
                    const pwd = document
                        .getElementById('loginPwd')
                        .value;
                    const result = vibesDB.loginUser(email, pwd);
                    if (result.success) {
                        alert(result.message);
                        closeAllModals();
                        // Refresh header iframe to update avatar
                        document
                            .querySelector('iframe[name="header"]')
                            .contentWindow
                            .location
                            .reload();
                    } else {
                        alert(result.message);
                    }
                });

            document
                .getElementById('registerForm')
                .addEventListener('submit', (e) => {
                    e.preventDefault();
                    const email = document
                        .getElementById('regEmail')
                        .value;
                    const pwd = document
                        .getElementById('regPwd')
                        .value;
                    const confirmPwd = document
                        .getElementById('regConfirmPwd')
                        .value;

                    if (pwd !== confirmPwd) {
                        alert("Password tidak sama!");
                        return;
                    }

                    const result = vibesDB.registerUser(email, pwd);
                    if (result.success) {
                        alert(result.message);
                        closeAllModals();
                        document
                            .querySelector('iframe[name="header"]')
                            .contentWindow
                            .location
                            .reload();
                    } else {
                        alert(result.message);
                    }
                });
        </script>
    </body>
</html>
