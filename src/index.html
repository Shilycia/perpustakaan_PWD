<!DOCTYPE html>
<html lang="en" scrolling="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibes</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>  
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.2.5/index.css" rel="stylesheet">
  <style>
    html,body {
      font-family: 'Geist Sans';
      overflow: hidden;
    }

    :root {
      --primary: #A30000;
      --secondary: #E5BEB7;
      --fg-second: #5E5E5E;
    }

    .wrapper {
      width: 100%;
      height: calc(100% - 4rem);
    }

    #content {
      width: 100%;
      min-height: 100%;
    }

    #navbar {
      width: 100%;
      height: 4rem;
      border: none;
      display: fixed;
    }

    .navbarMobile {
      position: fixed;
      top: 4rem;
      left: 0;
      width: 100%;
      background-color: #F9F9F9;
      transform: translateY(-150%);
      transition: transform 0.3s ease;
      z-index: 50;
      margin: 0;
      padding: 0;
      list-style: none;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .navbarMobile.show {
      transform: translateY(0); 
    }

    .navItem {
      text-align: center;
      border-bottom: 1px solid var(--secondary);
      padding: 1rem 0;
      font-weight: 600;
      cursor: pointer;
    }

    .navItem:hover {
      background-color: var(--secondary);
      color: var(--primary);
    }

    .navItem:active {
      color: var(--primary);
    }

    .menuOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 10;
      display: none;
      margin-top: 4rem;
    }

    .menuOverlay.show {
      display: block;
    }
  </style>
  <link rel="stylesheet" href="./index.css">  
</head>

<body>

<iframe id="navbar" src="navbar.html"></iframe>
<main class="wrapper">  
    <ul id="navbarMobile" class="navbarMobile">
      <li class="navItem" onclick="closeMenuAndNavigate('./pages/home.html')">Home</li>
      <li class="navItem" onclick="closeMenuAndNavigate('./pages/shop.html')">Shop</li>
      <li class="navItem" onclick="closeMenuAndNavigate('./pages/archivedOrder.html')">Orders</li>
    </ul>  
    <div id="menuOverlay" class="menuOverlay"></div>
  <iframe src="pages/home.html" id="content" ></iframe>
</main>
   
<script src="./js/data.js"></script>
<script>   
  autoResizeIframe("content");  

  function navigateTo(page) {
    document.getElementById('content').src = page;        
  }

  window.addEventListener('message', (e) => {
    if (e.data.iframeHeight) {
      document.getElementById('content').style.height = e.data.iframeHeight;
    }
  });

  function toggleMobileMenu() {
    const menu = document.getElementById('navbarMobile');
    const overlay = document.getElementById('menuOverlay');
    
    menu.classList.toggle('show');
    overlay.classList.toggle('show');
  }
  
  // Fungsi tutup menu dan navigasi
  function closeMenuAndNavigate(page) {
    const menu = document.getElementById('navbarMobile');
    const overlay = document.getElementById('menuOverlay');
    
    menu.classList.remove('show');
    overlay.classList.remove('show');
    
    navigateTo(page);
  }
  
  // Tutup menu kalau klik overlay
  document.getElementById('menuOverlay')?.addEventListener('click', () => {
    document.getElementById('navbarMobile')?.classList.remove('show');
    document.getElementById('menuOverlay')?.classList.remove('show');
  });
  
  // Listen message dari navbar.html untuk toggle menu
  window.addEventListener('message', (e) => {
    if (e.data.toggleMenu) {
      toggleMobileMenu();
    }
    
    if (e.data.iframeHeight) {
      document.getElementById('content').style.height = e.data.iframeHeight;
    }
  });
</script>

</body>
</html>
