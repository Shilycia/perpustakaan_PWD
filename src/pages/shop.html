<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.2.5/index.css" rel="stylesheet">
  <style>
    body, html {
      font-family: 'Geist Sans';
      max-width: 100vw;
      height: 100%;
      overflow: hidden;
    }

    :root {
      --primary: #A30000;
      --secondary: #E5BEB7;
      --fg-second: #5E5E5E;
    }

    .customRange {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: #e5e7eb;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    .customRange {
      background: linear-gradient(to right, var(--primary) 0%, var(--primary) 0%, #e5e7eb 0%, #e5e7eb 100%);
    }

    .customRange::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      background: white;
      border: 2px solid var(--primary);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .15);
      transition: transform .1s ease;
    }

    .customRange::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .customRange::-moz-range-thumb {
      width: 16px;
      height: 16px;
      background: white;
      border: 2px solid var(--primary);
      border-radius: 50%;
      cursor: pointer;
    }

    .customRange::-moz-range-track {
      height: 4px;
      background: #e5e7eb;
      border-radius: 4px;
    }

    .customRange::-moz-range-progress {
      height: 4px;
      background: var(--primary);
      border-radius: 4px;
    }

    .priceDisplay {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      font-size: .875rem;
      font-weight: 500;
    }

    .priceMin,.priceMax {
      color: var(--primary);
      font-weight: 600;
    }

    .priceSeparator {
      color: var(--fg-second);
    }

    .priceValueWrapper {
      background: #f5f5f5;
      padding: .5rem 1rem;
      border-radius: 8px;
      text-align: center;
    }

    .priceValue {
      font-size: 1rem;
      font-weight: 600;
      color: var(--primary);
    }

    .priceLabel {
      font-size: .7rem;
      color: var(--fg-second);
      margin-top: .25rem;
    }

    select:focus {
      outline: none;
    }

    .opsi {
      background: white;
      color: #333;
      padding: .5rem;
    }

    .menuOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, .5);
      z-index: 10;
      display: none;
    }

    .menuOverlay.show {
      display: block;
    }

    #slideBar.show {
      transform: translateX(0);
    }

    .subTitle {
      margin: .1rem 0;
    }

    @media (max-width: 767px) {
      #slideBar {
        position: fixed;
        transform: translateX(-88%);
        transition: transform .3s ease;
        z-index: 50;
        margin: 0;
        padding: 0;
        overflow-y: auto;
      }

      #shopSidebar {
        height: 100%;
        overflow-y: auto;
        padding-bottom: 10rem;
      }
    }
  </style>
  <link rel="stylesheet" href="../index.css">
</head>

<body>

  <div class="w-full flex" style="height: 100vh;">

    <div class="flex lg:w-4/20 md:w-1/3 max-md:w-4/5 h-full" id="slideBar">
      <div id="shopSidebar" class="bg-white px-2 overflow-y-auto h-full">
        <p class="subTitle">Category</p>
        <ul class="flex flex-col gap-2 py-2 border-b-1 border-[#E5BEB7]">
          <li><a href="#" class="btnCat">Outerwear</a><span id="sumOuterwear"></span></li>
          <li><a href="#" class="btnCat">Tops</a><span id="sumTops"></span></li>
          <li><a href="#" class="btnCat">Bottoms</a><span id="sumBottoms"></span></li>
          <li><a href="#" class="btnCat">Footwear</a><span id="sumFootwear"></span></li>
          <li><a href="#" class="btnCat">Accessories</a><span id="sumAccessories"></span></li>
        </ul>

        <div class="border-b-1 pb-2 border-[#E5BEB7]">
          <p class="subTitle">Size</p>
          <div class="flex flex-wrap gap-1">
            <button class="btnSize">XS</button>
            <button class="btnSize">S</button>
            <button class="btnSize">M</button>
            <button class="btnSize">L</button>
            <button class="btnSize">XL</button>
            <button class="btnSize">XXL</button>
          </div>
        </div>

        <div class="priceRangeContainer border-b-1 pb-2 border-[#E5BEB7]">
          <p class="subTitle">Price Range</p>
          <input type="range" id="priceRange" class="customRange" min="0" max="10000000" step="50000" value="500000">
          <div class="priceDisplay">
            <div class="priceValueWrapper">
              <div class="priceValue" id="minPriceValue">Rp 0</div>
              <div class="priceLabel">Minimum</div>
            </div>
            <span class="priceSeparator">—</span>
            <div class="priceValueWrapper">
              <div class="priceValue" id="maxPriceValue">Rp 10.000.000</div>
              <div class="priceLabel">Maksimum</div>
            </div>
          </div>
        </div>

        <div class="py-2">
          <p class="subTitle">Style</p>
          <button class="btnStyle">Monochrome</button>
          <button class="btnStyle">Techwear</button>
          <button class="btnStyle">High-Contest</button>
          <button class="btnStyle">Minimalist</button>
        </div>

        <button class="w-full py-2 mb-2 text-center bg-[#A30000] text-white font-semibold rounded-xl">Find</button>
      </div>

      <div id="btnSlide" onclick="toggleMobileMenu()"
        class="md:hidden mt-40 w-fit bg-white border-b border-t border-r rounded-r-md overflow-hidden border-[#A30000] h-fit pr-4 py-4 flex items-center">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
          class="size-8">
          <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
        </svg>
      </div>
    </div>

    <div id="menuOverlay" class="menuOverlay"></div>

    <div id="shopContent" class="flex-1 h-full ml-2 mb-6 mt-1 pr-2 overflow-y-auto">
      <p class="text-[#5E5E5E] text-xs">NEW SEASON</p>
      <h1 class="title">URBAN ESSENTIALS</h1>

      <div class="flex w-full justify-between">
        <div></div>
        <div class="w-6/10 flex items-end justify-end max-md:w-8/10">
          <span class="text-[#5E5E5E] text-xs mr-8">Showing <span></span> items</span>
          <span class="text-xs">Sort by:</span>
          <div class="relative">
            <button id="sortBtn" class="text-xs flex items-center gap-1">Newest ▾</button>
            <ul id="sortMenu"
              class="hidden absolute right-0 mt-1 bg-white border border-[#E5BEB7] rounded-lg overflow-hidden shadow-md z-10">
              <li class="px-4 py-2 text-xs hover:bg-[#E5BEB7] cursor-pointer">Newest</li>
              <li class="px-4 py-2 text-xs hover:bg-[#E5BEB7] cursor-pointer">Oldest</li>
              <li class="px-4 py-2 text-xs hover:bg-[#E5BEB7] cursor-pointer">Price: Low to High</li>
              <li class="px-4 py-2 text-xs hover:bg-[#E5BEB7] cursor-pointer">Price: High to Low</li>
            </ul>
          </div>
        </div>
      </div>

      <section id="shopProduct" class="py-2 my-4 flex flex-wrap gap-2 w-full justify-evenly"></section>
    </div>

  </div>

  <script src="../js/data.js"></script>
  <script>
    
    loadData(data => {
      const container = document.getElementById('shopProduct');
      const cards = data.products.map(product => createProductCard(product));
      container.innerHTML = cards.join('');
      
      document.querySelectorAll('.productCard').forEach(card => {
        card.addEventListener('click', () => {
          const product = JSON.parse(card.dataset.product);          
          parent.navigateTo(`/detail/${product.id}`);
        });
      });
    });    

    window.onload = () => parent.postMessage({ iframeHeight: '100vh' }, '*');

    // Sort dropdown
    const sortBtn = document.getElementById('sortBtn');
    const sortMenu = document.getElementById('sortMenu');

    sortBtn.addEventListener('click', () => sortMenu.classList.toggle('hidden'));
    sortMenu.querySelectorAll('li').forEach(li => {
      li.addEventListener('click', () => {
        sortBtn.textContent = li.textContent + ' ▾';
        sortMenu.classList.add('hidden');
      });
    });
    document.addEventListener('click', (e) => {
      if (!sortBtn.contains(e.target) && !sortMenu.contains(e.target)) sortMenu.classList.add('hidden');
    });

    // Mobile sidebar
    function toggleMobileMenu() {
      document.getElementById('slideBar').classList.toggle('show');
      document.getElementById('menuOverlay').classList.toggle('show');
    }

    function closeMenuAndNavigate(page) {
      document.getElementById('slideBar').classList.remove('show');
      document.getElementById('menuOverlay').classList.remove('show');
      navigateTo(page);
    }

    document.getElementById('menuOverlay')?.addEventListener('click', () => {
      document.getElementById('slideBar')?.classList.remove('show');
      document.getElementById('menuOverlay')?.classList.remove('show');
    });

    // Price range
    (function () {
      const rangeInput = document.getElementById('priceRange');
      const minDisplay = document.getElementById('minPriceValue');
      const maxDisplay = document.getElementById('maxPriceValue');
      const min = 0, max = 10000000, step = 50000;

      function updateProgress(value) {
        const percent = (value - min) / (max - min) * 100;
        rangeInput.style.background = `linear-gradient(to right, var(--primary) 0%, var(--primary) ${percent}%, #e5e7eb ${percent}%, #e5e7eb 100%)`;
      }

      function updateValue(value) {
        let rounded = Math.round(value / step) * step;
        rounded = Math.min(Math.max(rounded, min), max);
        minDisplay.textContent = formatRupiah(min);
        maxDisplay.textContent = formatRupiah(rounded);
        return rounded;
      }

      function onRangeChange() {
        let rounded = Math.round(parseInt(rangeInput.value) / step) * step;
        rounded = Math.min(Math.max(rounded, min), max);
        rangeInput.value = rounded;
        updateValue(rounded);
        updateProgress(rounded);
        rangeInput.dispatchEvent(new CustomEvent('priceChange', { detail: { price: rounded, formatted: formatRupiah(rounded) } }));
      }

      rangeInput.addEventListener('input', onRangeChange);
      rangeInput.addEventListener('change', onRangeChange);

      // Init
      const initial = Math.round(parseInt(rangeInput.value) / step) * step;
      rangeInput.value = initial;
      updateValue(initial);
      updateProgress(initial);

      window.getPriceRange = () => ({
        min, max: parseInt(rangeInput.value),
        minFormatted: formatRupiah(min),
        maxFormatted: formatRupiah(parseInt(rangeInput.value))
      });

      rangeInput.addEventListener('priceChange', (e) => console.log('Harga terpilih:', e.detail.formatted));
    })();
  </script>
</body>

</html>
