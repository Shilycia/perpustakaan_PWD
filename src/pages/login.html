<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Desktop</title>
  
  <link rel="stylesheet" href="../index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.2.5/index.css" rel="stylesheet">
  x 
  <style>
    * {
      font-family: 'Geist Sans', sans-serif;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background-color: #1a1d21; 
      display: flex;
      flex-direction: column;
    }

  </style>
</head>
<body>
  <div class="auth-page">
    <div class="main-gradient">
      <div class="login-card">
        <div class="vibes-logo">
          <img src="../../public/logo-putih.png" alt="VIBES">
        </div>
        <div class="subtitle">Silahkan masukan akun anda untuk masuk</div>
        <form action="#" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
          <div class="form-group">
            <label for="username">Username/Email</label>
            <div class="input-wrapper">
              <input type="text" name="username" id="username" autocomplete="off">
            </div>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <input type="password" name="password" id="password">
              <i class="fa-solid fa-eye-slash eye-icon" id="togglePassword"></i>
            </div>
          </div>
          <div class="extra-links">
            <a href="./register.html">Belum Punya Akun?</a>
          </div>
          <button type="submit" class="auth-btn">Login</button>
        </form>
      </div>
    </div>
  </div>
  <script>
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');
    togglePassword.addEventListener('click', function () {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      this.classList.toggle('fa-eye');
      this.classList.toggle('fa-eye-slash');
    });
  </script>
</body>
</html>
