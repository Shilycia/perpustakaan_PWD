<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Order History</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --primary: #A30000;
      --primary-dark: #7a0000;
      --text-main: #111111;
      --text-muted: #5E5E5E;
      --text-label: #9B9B9B;
      --border: #E5E5E5;
      --bg-page: #F7F7F7;
      --bg-card: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      padding: 1rem;      
    }

    /* ── Header ── */
    .pageHeader {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 28px;
    }
   
    .pageHeader p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
      max-width: 380px;
      line-height: 1.5;
    }
  
    /* ── Filter bar ── */
    .filterBar {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .btnFilter {
      border: 1.5px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 6px 14px;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.15s;
      border-radius: 6px;
    }

    .btnFilter:hover,
    .btnFilter.active {
      background: var(--text-main);
      color: #fff;
      border-color: var(--text-main);
    }

    /* ── Order Card ── */
    .orderCard {
      background: var(--bg-card);
      border: 1px solid var(--border);
      margin-bottom: 16px;
      cursor: pointer;
      transition: ease 0.3s;
    }

    .orderCard:hover {
      transform: translateY(-4px);
    }

    .orderMeta {
      display: flex;
      align-items: center;
      gap: 0;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .metaGroup {
      flex: 1;
      min-width: 120px;
    }

    .metaLabel {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-label);
      margin-bottom: 4px;
    }

    .metaValue {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .metaActions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }

    /* ── Status badges ── */
    .statusBadge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .statusBadge::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    .statusBadge.packaged {
      color: #B07D00;
    }
    .statusBadge.packaged::before {
      background: #E8A800;
    }

    .statusBadge.in_transit {
      color: #A30000;
    }
    .statusBadge.in_transit::before {
      background: #A30000;
    }

    .statusBadge.delivered {
      color: #3A3A3A;
    }
    .statusBadge.delivered::before {
      background: #3A3A3A;
    }

    /* ── Action Buttons ── */
    .btnPrimary {
      background: var(--text-main);
      color: #fff;
      border: none;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 9px 16px;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    .btnPrimary:hover {
      background: #333;
    }

    .btnSecondary {
      background: transparent;
      color: var(--text-main);
      border: 1.5px solid var(--text-main);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 9px 16px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
      border-radius: 6px;
    }

    .btnSecondary:hover {
      background: var(--text-main);
      color: #fff;
    }

    /* ── Order Items ── */
    .orderItems {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      padding: 16px 20px;
    }

    .orderItem {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 240px;            
    }

    .itemThumb {
      width: 64px;
      height: 64px;
      object-fit: cover;
      background: #EBEBEB;
      flex-shrink: 0;
      border-radius: 6px;
      overflow: hidden;
    }

    .itemThumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .itemInfo {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .itemName {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .itemVariant {
      font-size: 11px;
      color: var(--text-muted);
    }

    .itemPrice {
      font-size: 12px;
      font-weight: 600;
      margin-top: 4px;
    }

    /* ── Empty state ── */
    .emptyState {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .emptyState p {
      font-size: 13px;
      margin-top: 8px;
    }

    .emptyState .emptyIcon {
      font-size: 36px;
      margin-bottom: 12px;
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      body {
        padding: 20px 16px;
      }

      .orderItems{
        gap: 0.4rem;
      }

      .pageHeader {
        flex-direction: column;
        gap: 12px;
      }

      .orderMeta {
        gap: 12px;
      }

      .metaGroup {
        min-width: 80px;
      }

      .metaActions {
        width: 100%;
        margin-top: 8px;
      }

      .metaActions button {
        flex: 1;
      }
    }
  </style>
  <link rel="stylesheet" href="../index.css">
</head>
<body>

  <!-- Header -->
  <div class="pageHeader">
    <div>
      <h1 class="title">Order History</h1>
      <p>Review your past acquisitions and track current shipments from the Urban Velocity archives.</p>
    </div>    
  </div>

  <!-- Filter Bar -->
  <div class="filterBar">
    <button class="btnFilter active" data-filter="all">All Orders</button>
    <button class="btnFilter" data-filter="packaged">Packaged</button>
    <button class="btnFilter" data-filter="in_transit">In Transit</button>
    <button class="btnFilter" data-filter="delivered">Delivered</button>
  </div>

  <!-- Orders List -->
  <div id="orderList"></div>

  <script src="../js/data.js"></script>
  <script>    
    const STATUS_CONFIG = {
      packaged:   { label: 'Packaged',   class: 'packaged' },
      in_transit: { label: 'In Transit', class: 'in_transit' },
      delivered:  { label: 'Delivered',  class: 'delivered' },
    };

    function renderOrderCard(order) {
      const status = STATUS_CONFIG[order.status] || STATUS_CONFIG.delivered;

      const itemsHTML = order.items.map(item => `
        <div class="orderItem">
          <div class="itemThumb">
            <img src="${item.image}" alt="${item.name}" onerror="this.style.display='none'">
          </div>
          <div class="itemInfo">
            <div class="itemName">${item.name}</div>
            <div class="itemVariant">Size: ${item.size} / ${item.color}</div>
            <div class="itemPrice">${formatRupiah(item.price)}</div>
          </div>
        </div>
      `).join('');

      return `
        <div class="orderCard rounded-md" data-status="${order.status}" ">
          <div class="orderMeta">
            <div class="metaGroup">
              <div class="metaLabel">Order Number</div>
              <div class="metaValue">#${order.id}</div>
            </div>
            <div class="metaGroup">
              <div class="metaLabel">Date Placed</div>
              <div class="metaValue" style="font-weight:500;">${order.datePlaced}</div>
            </div>
            <div class="metaGroup">
              <div class="metaLabel">Total Amount</div>
              <div class="metaValue">${formatRupiah(order.totalAmount)}</div>
            </div>
            <div class="metaGroup">
              <div class="metaLabel">Status</div>
              <div class="metaValue">
                <span class="statusBadge ${status.class}">${status.label}</span>
              </div>
            </div>
            <div class="metaActions" >
              <button class="btnSecondary detailAction"  onclick="event.stopPropagation(); parent.navigateTo('/order-detail/${order.id}')">Details</button>
            </div>
          </div>
          <div class="orderItems">
            ${itemsHTML}
          </div>
        </div>
      `;
    }   

    let allOrders = [];

    function renderOrders(filter) {
      const container = document.getElementById('orderList');
      const filtered = filter === 'all' ? allOrders : allOrders.filter(o => o.status === filter);
      container.innerHTML = filtered.length
        ? filtered.map(renderOrderCard).join('')
        : `<div class="emptyState"><div class="emptyIcon">📦</div><strong>No orders found</strong></div>`;
    }

    document.querySelectorAll('.btnFilter').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.btnFilter').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderOrders(btn.dataset.filter);
      });
    });
    
    loadData(data => {
      allOrders = data.orders;
      renderOrders('all');    
    });
   
    window.onload = () => parent.postMessage({ iframeHeight: '100vh' }, '*');
  </script>

</body>
</html>
